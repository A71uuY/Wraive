name: Test and build Wear OS APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - run: bash gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Verify comparison APK
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/badging"
          grep -F "package: name='moye.wear.wraive.modified'" "$RUNNER_TEMP/badging"
          grep -Fx "application-label:'Wraive 修改版'" "$RUNNER_TEMP/badging"
          grep -F "launchable-activity: name='moye.wear.wraive.MainActivity'" "$RUNNER_TEMP/badging"
      - name: Sign and verify update APK
        env:
          SIGNING_STORE: ${{ secrets.WRAIVE_MODIFIED_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.WRAIVE_MODIFIED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/wraive-modified.p12"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$SIGNING_STORE" | base64 --decode > "$store"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" sign --ks "$store" --ks-type PKCS12 --ks-key-alias modified \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
            --out wraive-modified.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs wraive-modified.apk | tee "$RUNNER_TEMP/signature"
          grep -F 'certificate SHA-256 digest: 5e6663a10abe05f9c9d220d98bcf36a653462299e385a50fa804bd3eeacf40fb' "$RUNNER_TEMP/signature"
      - uses: actions/upload-artifact@v4
        with:
          name: wraive-modified-side-by-side
          path: wraive-modified.apk
          if-no-files-found: error
